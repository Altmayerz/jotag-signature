<!-- A jaqueta solta: cena presa. A Tricot voa de baixo girando e pousa no meio (presa à rolagem); as palavras
     acendem uma a uma, os rótulos pregam nos pontos da peça e o adesivo do logo bate em cima, por marco
     (motion/solta.js). -->
<section class="solta cobre" aria-labelledby="solta-titulo" data-cena>
  <div class="solta__palco">
    <h2 class="solta__frase" id="solta-titulo"><span class="w">O</span> <span class="w">frio</span> <span class="w">fica</span><br><span class="w">do</span> <span class="w">lado</span> <span class="w">de</span> <span class="w">fora.</span></h2>
    <p class="solta__teste">Testada em câmara fria<br>a −40 °C.</p>
    <div class="solta__peca">
      <img class="solta__img" src="img/solta.webp" alt="A jaqueta Tricot Classic sozinha, flutuando" width="1000" height="1000" loading="lazy" decoding="async">
      <ul class="pinos" aria-label="Detalhes da Tricot">
        <li class="pino" style="--x:57%;--y:10%" data-lado="dir"><span class="pino__ponto"></span><span class="pino__fio"></span><span class="pino__txt">Capuz que cabe o capacete</span></li>
        <li class="pino" style="--x:56%;--y:36%" data-lado="dir"><span class="pino__ponto"></span><span class="pino__fio"></span><span class="pino__txt">Pluma de ganso 800 FP</span></li>
        <li class="pino" style="--x:29%;--y:60%" data-lado="esq"><span class="pino__ponto"></span><span class="pino__fio"></span><span class="pino__txt">Ripstop 20D com brilho</span></li>
        <li class="pino" style="--x:58%;--y:63%" data-lado="dir"><span class="pino__ponto"></span><span class="pino__fio"></span><span class="pino__txt">Testada a −30&nbsp;°C</span></li>
      </ul>
      <span class="solta__selo" aria-hidden="true"><!-- @svg logo solta__logo --></span>
    </div>
    <p class="solta__ficha">Tricot Classic<br>1,4 kg · 800 FP<br>Tecido 20D reciclado</p>
    <a class="botao botao--escuro solta__comprar" href="produto/serac/#breu" data-troca data-label="Tricot Classic"><span class="botao__txt">Comprar Tricot</span><span class="botao__preco">R$ 1.890</span></a>
  </div>
</section>
