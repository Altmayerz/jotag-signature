<!-- Topo: links à esquerda, a marca no meio, ajuda e ícones à direita. Sobre o hero ele pega a cor do texto da
     cor ativa; ao rolar vira uma barra escura flutuante (motion/topo.js). -->
<header class="topo" data-topo>
  <nav class="topo__nav" aria-label="Loja">
    <a class="topo__link" href="#colecao">Loja</a>
    <a class="topo__link" href="#colecao">Vestuário</a>
    <a class="topo__link" href="#acessorios">Seleção</a>
    <a class="topo__link" href="#lookbook">Lookbook</a>
  </nav>
  <a class="topo__marca" href="#hero" aria-label="JotaG Signature, início"><!-- @svg logo topo__logo --></a>
  <div class="topo__acoes">
    <a class="topo__link topo__ajuda" href="#ajuda">Ajuda</a>
    <button class="topo__icone" type="button" aria-label="Buscar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2"/><path d="m15.2 15.2 4.6 4.6"/></svg>
    </button>
    <button class="topo__icone" type="button" aria-label="Favoritos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19.6s-7.2-4.3-7.2-9.4A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7.2 2.2c0 5.1-7.2 9.4-7.2 9.4Z"/></svg>
    </button>
    <button class="topo__icone topo__sacola" type="button" aria-label="Sacola, vazia" data-abre-sacola>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.6 8.4h12.8l-.9 11.2H6.5L5.6 8.4Z"/><path d="M9 8.4V7a3 3 0 0 1 6 0v1.4"/></svg>
      <span class="topo__conta" data-conta>0</span>
    </button>
  </div>
</header>
